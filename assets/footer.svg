<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 230" width="900" height="230">
  <defs>
    <linearGradient id="bgF" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#0a1428"/>
    </linearGradient>
    <linearGradient id="neonTxt" gradientUnits="userSpaceOnUse" x1="150" y1="0" x2="750" y2="0">
      <stop offset="0" stop-color="#00f0ff">
        <animate attributeName="stop-color" values="#00f0ff;#ff2bd6;#7c4dff;#00f0ff" dur="5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="0.5" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ff2bd6">
        <animate attributeName="stop-color" values="#ff2bd6;#7c4dff;#00f0ff;#ff2bd6" dur="5s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <filter id="glowF" x="-20%" y="-60%" width="140%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="crtF" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000" fill-opacity=".18"/>
    </pattern>
    <style>
      .px { font-family: 'Press Start 2P','Courier New',Consolas,monospace; font-weight: 700; }
      .sans { font-family: 'Segoe UI','Helvetica Neue',Arial,sans-serif; }
      .big { animation: pop 6s ease-in-out infinite; transform-origin: 450px 78px; }
      @keyframes pop { 0%,100% { transform: scale(1); } 50% { transform: scale(1.03); } }
      .blink { animation: blink 1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      .n { opacity: 0; animation: num 10s steps(1) infinite; }
      @keyframes num { 0% { opacity: 1; } 10%,100% { opacity: 0; } }
      .star { transform-box: fill-box; transform-origin: center; animation: spinStar 3s ease-in-out infinite; }
      @keyframes spinStar { 0%,100% { transform: rotate(0) scale(1); } 50% { transform: rotate(72deg) scale(1.25); } }
      .heart { animation: beat 1.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes beat { 0%,100% { transform: scale(1); } 15% { transform: scale(1.3); } 30% { transform: scale(1); } }
      .tw { animation: tw 2.6s ease-in-out infinite; }
      @keyframes tw { 0%,100% { opacity: .1; } 50% { opacity: 1; } }
      .coin { animation: coin 2.4s ease-in infinite; }
      @keyframes coin {
        0% { transform: translateY(-40px); opacity: 0; }
        15% { opacity: 1; }
        70% { transform: translateY(0); opacity: 1; }
        80%,100% { transform: translateY(6px); opacity: 0; }
      }
      .coinflip { transform-box: fill-box; transform-origin: center; animation: flip .6s linear infinite; }
      @keyframes flip { 0%,100% { transform: scaleX(1); } 50% { transform: scaleX(.15); } }
    </style>
  </defs>

  <rect width="900" height="230" rx="16" fill="url(#bgF)"/>

  <g fill="#9fe8ff">
    <circle class="tw" cx="70" cy="40" r="1.6"/>
    <circle class="tw" cx="160" cy="150" r="1.2" style="animation-delay:.7s"/>
    <circle class="tw" cx="250" cy="30" r="1.4" style="animation-delay:1.3s"/>
    <circle class="tw" cx="650" cy="28" r="1.4" style="animation-delay:.4s"/>
    <circle class="tw" cx="760" cy="150" r="1.2" style="animation-delay:1.9s"/>
    <circle class="tw" cx="840" cy="50" r="1.6" style="animation-delay:1s"/>
    <circle class="tw" cx="40" cy="190" r="1.2" style="animation-delay:2.2s"/>
    <circle class="tw" cx="870" cy="200" r="1.2" style="animation-delay:.2s"/>
  </g>

  <g>
    <text x="80" y="92" text-anchor="middle" class="px" font-size="13" fill="#ffe66d" letter-spacing="2">CONTINUE?</text>
    <g class="px" font-size="44" fill="#ff2bd6" text-anchor="middle" filter="url(#glowF)">
      <text class="n" x="80" y="150" style="animation-delay:0s">9</text>
      <text class="n" x="80" y="150" style="animation-delay:1s">8</text>
      <text class="n" x="80" y="150" style="animation-delay:2s">7</text>
      <text class="n" x="80" y="150" style="animation-delay:3s">6</text>
      <text class="n" x="80" y="150" style="animation-delay:4s">5</text>
      <text class="n" x="80" y="150" style="animation-delay:5s">4</text>
      <text class="n" x="80" y="150" style="animation-delay:6s">3</text>
      <text class="n" x="80" y="150" style="animation-delay:7s">2</text>
      <text class="n" x="80" y="150" style="animation-delay:8s">1</text>
      <text class="n" x="80" y="150" style="animation-delay:9s">0</text>
    </g>
  </g>

  <g>
    <rect x="792" y="112" width="56" height="10" rx="5" fill="#1b2640" stroke="#00f0ff" stroke-opacity=".6"/>
    <g class="coin">
      <g class="coinflip">
        <circle cx="820" cy="94" r="14" fill="#ffcb3c" stroke="#ff9a3c" stroke-width="3"/>
        <text x="820" y="99" text-anchor="middle" class="px" font-size="13" fill="#b8650a">$</text>
      </g>
    </g>
    <text x="820" y="150" text-anchor="middle" class="px blink" font-size="11" fill="#00f0ff" letter-spacing="1">INSERT COIN</text>
  </g>

  <g class="big">
    <text x="450" y="88" text-anchor="middle" class="sans" font-size="38" font-weight="900" font-style="italic"
          fill="url(#neonTxt)" filter="url(#glowF)" letter-spacing="3">THANKS FOR VISITING</text>
  </g>

  <g>
    <g transform="translate(250 132)"><polygon class="star" points="0,-12 3.5,-4 12,-4 5,1.5 7.5,10 0,5 -7.5,10 -5,1.5 -12,-4 -3.5,-4" fill="#ffe66d"/></g>
    <text x="462" y="138" text-anchor="middle" class="sans" font-size="17" font-weight="700" fill="#e6edf3" letter-spacing="1">Drop a star on my repos if you like them!</text>
  </g>

  <text x="450" y="182" text-anchor="middle" class="px" font-size="12" fill="#7c8db5" letter-spacing="2">
    MADE WITH <tspan class="heart" fill="#ff2b55">♥</tspan> BY WAHYU  ·  SEE YOU NEXT LEVEL
  </text>

  <rect width="900" height="230" rx="16" fill="url(#crtF)"/>
  <rect x="1" y="1" width="898" height="228" rx="16" fill="none" stroke="#7c4dff" stroke-opacity=".35" stroke-width="2"/>
</svg>

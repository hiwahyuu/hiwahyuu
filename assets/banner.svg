<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05070d"/>
      <stop offset="0.55" stop-color="#0a1330"/>
      <stop offset="1" stop-color="#041a2b"/>
    </linearGradient>
    <linearGradient id="nameGrad" gradientUnits="userSpaceOnUse" x1="250" y1="0" x2="950" y2="0">
      <stop offset="0" stop-color="#00d4ff">
        <animate attributeName="stop-color" values="#00d4ff;#7c4dff;#00ffa3;#00d4ff" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="0.5" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#7c4dff">
        <animate attributeName="stop-color" values="#7c4dff;#00ffa3;#00d4ff;#7c4dff" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#0052cc" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#0052cc" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7c4dff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7c4dff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="floorFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05070d" stop-opacity="1"/>
      <stop offset="0.6" stop-color="#05070d" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="floorClip"><rect x="0" y="230" width="1200" height="110"/></clipPath>
    <filter id="neon" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .mono { font-family: 'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace; }
      .sans { font-family: 'Segoe UI','Helvetica Neue',Arial,sans-serif; }
      .name { font-size: 64px; font-weight: 800; letter-spacing: 2px; }
      .glitch-c { fill: #00e5ff; opacity: 0; animation: gc 4s infinite steps(1); }
      .glitch-m { fill: #ff2bd6; opacity: 0; animation: gm 4s infinite steps(1); }
      @keyframes gc {
        0%, 86%, 100% { opacity: 0; transform: translate(0,0); }
        88% { opacity: .8; transform: translate(-6px, 2px); }
        90% { opacity: .8; transform: translate(4px, -2px); }
        92% { opacity: 0; }
        95% { opacity: .7; transform: translate(-3px, 0); }
        96% { opacity: 0; }
      }
      @keyframes gm {
        0%, 86%, 100% { opacity: 0; transform: translate(0,0); }
        88% { opacity: .8; transform: translate(6px, -2px); }
        90% { opacity: .8; transform: translate(-4px, 2px); }
        92% { opacity: 0; }
        95% { opacity: .7; transform: translate(3px, 0); }
        96% { opacity: 0; }
      }
      .name-main { animation: jitter 4s infinite steps(1); }
      @keyframes jitter {
        0%, 86%, 100% { transform: translate(0,0); }
        88% { transform: translate(2px,0) skewX(-6deg); }
        90% { transform: translate(-2px,0) skewX(4deg); }
        92% { transform: translate(0,0); }
      }
      .tagline { font-size: 19px; fill: #9fb4d9; letter-spacing: 1px; }
      .chip { font-size: 15px; font-weight: 600; letter-spacing: 1px; }
      .cursor { animation: blink 1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      .scan { animation: scan 5s linear infinite; }
      @keyframes scan { 0% { transform: translateY(-40px); } 100% { transform: translateY(380px); } }
      .floor { animation: floor 1.6s linear infinite; }
      @keyframes floor { from { transform: translateY(0); } to { transform: translateY(22px); } }
      .ring1 { transform-origin: 1080px 120px; animation: spin 14s linear infinite; }
      .ring2 { transform-origin: 1080px 120px; animation: spin 9s linear infinite reverse; }
      .ring3 { transform-origin: 120px 230px; animation: spin 18s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      .float { animation: floatY 6s ease-in-out infinite; }
      .float2 { animation: floatY 7.5s ease-in-out infinite reverse; }
      @keyframes floatY { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
      .fadeup { opacity: 0; animation: fadeup 1.2s ease-out forwards; }
      .d1 { animation-delay: .2s; } .d2 { animation-delay: .6s; } .d3 { animation-delay: 1s; }
      .d4 { animation-delay: 1.2s; } .d5 { animation-delay: 1.4s; }
      @keyframes fadeup { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
      .underline { stroke-dasharray: 520; stroke-dashoffset: 520; animation: draw 1.6s .9s ease-out forwards; }
      @keyframes draw { to { stroke-dashoffset: 0; } }
      .pulse { animation: pulse 2s ease-in-out infinite; }
      @keyframes pulse { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
    </style>
  </defs>

  <rect width="1200" height="340" rx="18" fill="url(#bg)"/>
  <circle cx="260" cy="60" r="260" fill="url(#glowA)"/>
  <circle cx="980" cy="300" r="280" fill="url(#glowB)"/>

  <g clip-path="url(#floorClip)" stroke="#00d4ff" stroke-opacity="0.35" stroke-width="1">
    <g class="floor">
      <line x1="0" y1="208" x2="1200" y2="208"/>
      <line x1="0" y1="230" x2="1200" y2="230"/>
      <line x1="0" y1="252" x2="1200" y2="252"/>
      <line x1="0" y1="274" x2="1200" y2="274"/>
      <line x1="0" y1="296" x2="1200" y2="296"/>
      <line x1="0" y1="318" x2="1200" y2="318"/>
      <line x1="0" y1="340" x2="1200" y2="340"/>
    </g>
    <line x1="600" y1="230" x2="-600" y2="340"/>
    <line x1="600" y1="230" x2="-200" y2="340"/>
    <line x1="600" y1="230" x2="150" y2="340"/>
    <line x1="600" y1="230" x2="400" y2="340"/>
    <line x1="600" y1="230" x2="600" y2="340"/>
    <line x1="600" y1="230" x2="800" y2="340"/>
    <line x1="600" y1="230" x2="1050" y2="340"/>
    <line x1="600" y1="230" x2="1400" y2="340"/>
    <line x1="600" y1="230" x2="1800" y2="340"/>
  </g>
  <rect x="0" y="230" width="1200" height="110" fill="url(#floorFade)"/>

  <g fill="#00d4ff">
    <circle cx="90" cy="340" r="2"><animate attributeName="cy" from="340" to="-10" dur="7s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="7s" repeatCount="indefinite"/></circle>
    <circle cx="210" cy="340" r="1.5"><animate attributeName="cy" from="340" to="-10" dur="9s" begin="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="9s" begin="2s" repeatCount="indefinite"/></circle>
    <circle cx="380" cy="340" r="2.5"><animate attributeName="cy" from="340" to="-10" dur="8s" begin="1s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.9;0" dur="8s" begin="1s" repeatCount="indefinite"/></circle>
    <circle cx="520" cy="340" r="1.5"><animate attributeName="cy" from="340" to="-10" dur="10s" begin="4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="10s" begin="4s" repeatCount="indefinite"/></circle>
    <circle cx="690" cy="340" r="2"><animate attributeName="cy" from="340" to="-10" dur="7.5s" begin="3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="7.5s" begin="3s" repeatCount="indefinite"/></circle>
    <circle cx="840" cy="340" r="1.5"><animate attributeName="cy" from="340" to="-10" dur="9.5s" begin=".5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="9.5s" begin=".5s" repeatCount="indefinite"/></circle>
    <circle cx="960" cy="340" r="2.5"><animate attributeName="cy" from="340" to="-10" dur="8.5s" begin="5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.9;0" dur="8.5s" begin="5s" repeatCount="indefinite"/></circle>
    <circle cx="1130" cy="340" r="2"><animate attributeName="cy" from="340" to="-10" dur="7s" begin="2.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="7s" begin="2.5s" repeatCount="indefinite"/></circle>
  </g>
  <g fill="#7c4dff">
    <circle cx="150" cy="340" r="2"><animate attributeName="cy" from="340" to="-10" dur="11s" begin="1.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.8;0" dur="11s" begin="1.5s" repeatCount="indefinite"/></circle>
    <circle cx="610" cy="340" r="2"><animate attributeName="cy" from="340" to="-10" dur="12s" begin="6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.8;0" dur="12s" begin="6s" repeatCount="indefinite"/></circle>
    <circle cx="1040" cy="340" r="2"><animate attributeName="cy" from="340" to="-10" dur="10s" begin="3.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.8;0" dur="10s" begin="3.5s" repeatCount="indefinite"/></circle>
  </g>

  <g class="float">
    <g class="ring1" fill="none" stroke="#00d4ff" stroke-width="2" stroke-opacity=".7">
      <circle cx="1080" cy="120" r="62" stroke-dasharray="70 26"/>
    </g>
    <g class="ring2" fill="none" stroke="#7c4dff" stroke-width="3" stroke-opacity=".8">
      <circle cx="1080" cy="120" r="44" stroke-dasharray="14 10"/>
    </g>
    <polygon points="1080,96 1101,108 1101,132 1080,144 1059,132 1059,108" fill="#00d4ff" fill-opacity=".12" stroke="#00d4ff" stroke-width="1.5"/>
    <text x="1080" y="127" text-anchor="middle" class="mono" font-size="18" font-weight="700" fill="#00d4ff">&lt;/&gt;</text>
  </g>

  <g class="float2">
    <g class="ring3" fill="none" stroke="#00ffa3" stroke-width="1.5" stroke-opacity=".6">
      <circle cx="120" cy="230" r="38" stroke-dasharray="4 8"/>
      <circle cx="120" cy="230" r="26" stroke-dasharray="40 12"/>
    </g>
    <text x="120" y="236" text-anchor="middle" font-size="18">🎮</text>
  </g>

  <g fill="none" stroke="#00d4ff" stroke-width="2" stroke-opacity=".6">
    <path d="M24 56 V24 H56"/>
    <path d="M1144 24 H1176 V56"/>
    <path d="M24 284 V316 H56"/>
    <path d="M1176 284 V316 H1144"/>
  </g>

  <g class="fadeup d1">
    <text x="600" y="72" text-anchor="middle" class="mono" font-size="16" fill="#5f7ba8">
      <tspan fill="#00ffa3">hiwahyuu@amikom</tspan><tspan fill="#5f7ba8">:</tspan><tspan fill="#00d4ff">~/portfolio</tspan><tspan fill="#5f7ba8">$ ./hello --world </tspan><tspan class="cursor" fill="#00ffa3">█</tspan>
    </text>
  </g>

  <g class="fadeup d2">
    <text x="600" y="152" text-anchor="middle" class="sans name glitch-c">WAHYU FADHIL ATSANI</text>
    <text x="600" y="152" text-anchor="middle" class="sans name glitch-m">WAHYU FADHIL ATSANI</text>
    <text x="600" y="152" text-anchor="middle" class="sans name name-main" fill="url(#nameGrad)" filter="url(#neon)">WAHYU FADHIL ATSANI</text>
  </g>
  <line class="underline" x1="340" y1="172" x2="860" y2="172" stroke="url(#nameGrad)" stroke-width="3" stroke-linecap="round"/>

  <text x="600" y="206" text-anchor="middle" class="sans tagline fadeup d3">Information Systems Student  ·  Web Developer  ·  Content Creator</text>

  <g class="fadeup d4">
    <rect x="388" y="232" width="128" height="34" rx="17" fill="#00d4ff" fill-opacity=".1" stroke="#00d4ff" stroke-opacity=".6"/>
    <text x="452" y="254" text-anchor="middle" class="sans chip" fill="#00d4ff">LARAVEL</text>
    <rect x="536" y="232" width="128" height="34" rx="17" fill="#7c4dff" fill-opacity=".12" stroke="#7c4dff" stroke-opacity=".7"/>
    <text x="600" y="254" text-anchor="middle" class="sans chip" fill="#b49bff">UI / UX</text>
    <rect x="684" y="232" width="140" height="34" rx="17" fill="#ff2b55" fill-opacity=".1" stroke="#ff2b55" stroke-opacity=".7"/>
    <circle class="pulse" cx="702" cy="249" r="5" fill="#ff2b55"/>
    <text x="760" y="254" text-anchor="middle" class="sans chip" fill="#ff6b86">STREAMER</text>
  </g>

  <text x="600" y="300" text-anchor="middle" class="mono fadeup d5" font-size="13" fill="#4d6690">📍 Sleman, Yogyakarta — Indonesia</text>

  <rect class="scan" x="0" y="0" width="1200" height="40" fill="#00d4ff" opacity=".05"/>
  <rect class="scan" x="0" y="38" width="1200" height="2" fill="#00d4ff" opacity=".25"/>
  <rect x="1" y="1" width="1198" height="338" rx="18" fill="none" stroke="#00d4ff" stroke-opacity=".25" stroke-width="2"/>
</svg>

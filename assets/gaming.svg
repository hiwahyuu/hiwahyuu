<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05010f"/>
      <stop offset="0.45" stop-color="#1a0638"/>
      <stop offset="0.75" stop-color="#4a0b5e"/>
      <stop offset="1" stop-color="#ff2b84"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe66d"/>
      <stop offset="0.45" stop-color="#ff9a3c"/>
      <stop offset="1" stop-color="#ff2b84"/>
    </linearGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8fbff"/>
      <stop offset="0.45" stop-color="#7fd8ff"/>
      <stop offset="0.5" stop-color="#1b1b4a"/>
      <stop offset="0.62" stop-color="#ff5fb8"/>
      <stop offset="1" stop-color="#ffe0f2"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0030"/>
      <stop offset="1" stop-color="#05010f"/>
    </linearGradient>
    <linearGradient id="horizonFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff2b84" stop-opacity=".9"/>
      <stop offset=".25" stop-color="#1a0030" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ff5fa0" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ff5fa0" stop-opacity="0"/>
    </radialGradient>
    <mask id="sunMask">
      <rect x="0" y="0" width="900" height="300" fill="#fff"/>
      <g fill="#000">
        <g>
          <rect x="300" y="150" width="300" height="4"/>
          <rect x="300" y="164" width="300" height="5"/>
          <rect x="300" y="178" width="300" height="6"/>
          <rect x="300" y="192" width="300" height="7"/>
          <rect x="300" y="206" width="300" height="8"/>
          <animateTransform attributeName="transform" type="translate" values="0 -14;0 0" dur="1.6s" repeatCount="indefinite"/>
        </g>
      </g>
      <rect x="300" y="60" width="300" height="88" fill="#fff"/>
    </mask>
    <clipPath id="sky-clip"><rect x="0" y="0" width="900" height="205"/></clipPath>
    <clipPath id="ground-clip"><rect x="0" y="205" width="900" height="95"/></clipPath>
    <pattern id="crt" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000" fill-opacity=".22"/>
    </pattern>
    <filter id="glow" x="-30%" y="-60%" width="160%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="bigGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <style>
      .tw { animation: tw 3s ease-in-out infinite; }
      @keyframes tw { 0%,100% { opacity: .15; } 50% { opacity: 1; } }
      .roadlines { animation: road 1.1s linear infinite; }
      @keyframes road { from { transform: translateY(0); } to { transform: translateY(18px); } }
      .start { animation: start 1.2s steps(1) infinite; }
      @keyframes start { 0%,60% { opacity: 1; } 61%,100% { opacity: 0; } }
      .title { animation: titleIn 1.4s cubic-bezier(.2,1.4,.4,1) forwards, flicker 6s 1.4s infinite; opacity: 0; transform-origin: 450px 92px; }
      @keyframes titleIn { 0% { opacity: 0; transform: scale(2.2); } 100% { opacity: 1; transform: scale(1); } }
      @keyframes flicker { 0%,93%,100% { opacity: 1; } 94% { opacity: .4; } 95% { opacity: 1; } 96% { opacity: .6; } 97% { opacity: 1; } }
      .sub { opacity: 0; animation: fade 1s 1.2s ease-out forwards; }
      @keyframes fade { to { opacity: 1; } }
      .sunbreath { transform-origin: 450px 160px; animation: breath 4s ease-in-out infinite; }
      @keyframes breath { 0%,100% { transform: scale(1); } 50% { transform: scale(1.04); } }
      .shoot { animation: shoot 7s linear infinite; }
      .shoot2 { animation: shoot 9s 3.5s linear infinite; }
      @keyframes shoot {
        0% { transform: translate(0,0); opacity: 0; }
        2% { opacity: 1; }
        10% { transform: translate(-260px,110px); opacity: 0; }
        100% { transform: translate(-260px,110px); opacity: 0; }
      }
      .crt { animation: roll 8s linear infinite; }
      @keyframes roll { from { transform: translateY(-300px); } to { transform: translateY(300px); } }
      .pixel { font-family: 'Press Start 2P','Courier New',Consolas,monospace; font-weight: 700; }
      .sans { font-family: 'Segoe UI','Helvetica Neue',Arial,sans-serif; }
    </style>
  </defs>

  <rect width="900" height="300" rx="16" fill="url(#sky)"/>

  <g fill="#fff">
    <circle class="tw" cx="60" cy="30" r="1.4"/>
    <circle class="tw" cx="140" cy="70" r="1" style="animation-delay:.6s"/>
    <circle class="tw" cx="215" cy="22" r="1.6" style="animation-delay:1.4s"/>
    <circle class="tw" cx="290" cy="58" r="1" style="animation-delay:2s"/>
    <circle class="tw" cx="340" cy="18" r="1.2" style="animation-delay:.3s"/>
    <circle class="tw" cx="560" cy="26" r="1.3" style="animation-delay:1.1s"/>
    <circle class="tw" cx="620" cy="66" r="1" style="animation-delay:2.4s"/>
    <circle class="tw" cx="700" cy="20" r="1.6" style="animation-delay:.9s"/>
    <circle class="tw" cx="770" cy="54" r="1.1" style="animation-delay:1.8s"/>
    <circle class="tw" cx="840" cy="28" r="1.4" style="animation-delay:.2s"/>
    <circle class="tw" cx="30" cy="110" r="1" style="animation-delay:2.2s"/>
    <circle class="tw" cx="870" cy="110" r="1" style="animation-delay:1.6s"/>
    <circle class="tw" cx="110" cy="140" r="1.2" style="animation-delay:.8s"/>
    <circle class="tw" cx="800" cy="150" r="1.2" style="animation-delay:2.7s"/>
  </g>

  <g stroke-linecap="round">
    <line class="shoot" x1="760" y1="10" x2="800" y2="-6" stroke="#fff" stroke-width="2"/>
    <line class="shoot2" x1="420" y1="8" x2="452" y2="-5" stroke="#9fe8ff" stroke-width="1.5"/>
  </g>

  <g clip-path="url(#sky-clip)">
    <circle cx="450" cy="160" r="150" fill="url(#sunGlow)"/>
    <g class="sunbreath">
      <circle cx="450" cy="160" r="96" fill="url(#sun)" mask="url(#sunMask)"/>
    </g>
    <path d="M0 205 L60 150 L110 178 L170 120 L230 170 L280 140 L345 205 Z" fill="#12022a" stroke="#ff5fb8" stroke-width="1.5" stroke-opacity=".8"/>
    <path d="M90 205 L170 120 L250 205" fill="none" stroke="#7c4dff" stroke-opacity=".5"/>
    <path d="M555 205 L620 145 L670 172 L740 112 L800 160 L850 135 L900 170 L900 205 Z" fill="#12022a" stroke="#ff5fb8" stroke-width="1.5" stroke-opacity=".8"/>
    <path d="M660 205 L740 112 L820 205" fill="none" stroke="#7c4dff" stroke-opacity=".5"/>
  </g>

  <rect x="0" y="205" width="900" height="95" fill="url(#ground)"/>
  <rect x="0" y="205" width="900" height="95" fill="url(#horizonFade)"/>
  <g clip-path="url(#ground-clip)" stroke="#ff2bd6" stroke-width="1.4" stroke-opacity=".75">
    <g class="roadlines">
      <line x1="0" y1="187" x2="900" y2="187"/>
      <line x1="0" y1="205" x2="900" y2="205"/>
      <line x1="0" y1="223" x2="900" y2="223"/>
      <line x1="0" y1="241" x2="900" y2="241"/>
      <line x1="0" y1="259" x2="900" y2="259"/>
      <line x1="0" y1="277" x2="900" y2="277"/>
      <line x1="0" y1="295" x2="900" y2="295"/>
    </g>
    <line x1="450" y1="205" x2="-450" y2="300"/>
    <line x1="450" y1="205" x2="-150" y2="300"/>
    <line x1="450" y1="205" x2="110" y2="300"/>
    <line x1="450" y1="205" x2="300" y2="300"/>
    <line x1="450" y1="205" x2="450" y2="300"/>
    <line x1="450" y1="205" x2="600" y2="300"/>
    <line x1="450" y1="205" x2="790" y2="300"/>
    <line x1="450" y1="205" x2="1050" y2="300"/>
    <line x1="450" y1="205" x2="1350" y2="300"/>
  </g>
  <line x1="0" y1="205" x2="900" y2="205" stroke="#ff7ad9" stroke-width="2" filter="url(#glow)"/>

  <g class="title">
    <text x="450" y="112" text-anchor="middle" class="sans" font-size="78" font-weight="900" font-style="italic" fill="#ff2bd6" opacity=".55" filter="url(#bigGlow)" letter-spacing="4">GAME ON</text>
    <text x="453" y="115" text-anchor="middle" class="sans" font-size="78" font-weight="900" font-style="italic" fill="#2a0050" letter-spacing="4">GAME ON</text>
    <text x="450" y="112" text-anchor="middle" class="sans" font-size="78" font-weight="900" font-style="italic" fill="url(#chrome)" stroke="#ffffff" stroke-width="1.2" letter-spacing="4">GAME ON</text>
  </g>

  <text x="450" y="146" text-anchor="middle" class="sans sub" font-size="17" font-weight="700" fill="#ffffff" stroke="#2a0050" stroke-width="4" paint-order="stroke" letter-spacing="5">GAMING CREATOR  ✦  LIVE STREAMER</text>

  <text x="450" y="262" text-anchor="middle" class="pixel start" font-size="18" fill="#00f0ff" letter-spacing="4" filter="url(#glow)">▶ PRESS START</text>
  <text x="450" y="286" text-anchor="middle" class="pixel sub" font-size="11" fill="#c9a7ff" letter-spacing="2">YT @bayok99   ·   TIKTOK @byxwy</text>

  <text x="26" y="34" class="pixel" font-size="12" fill="#ffe66d" letter-spacing="2">1UP  WAHYU</text>
  <text x="874" y="34" text-anchor="end" class="pixel" font-size="12" fill="#00f0ff" letter-spacing="2">HI-SCORE ∞</text>

  <rect width="900" height="300" rx="16" fill="url(#crt)"/>
  <rect class="crt" x="0" y="0" width="900" height="60" fill="#fff" opacity=".035"/>
  <rect x="1" y="1" width="898" height="298" rx="16" fill="none" stroke="#ff5fb8" stroke-opacity=".4" stroke-width="2"/>
</svg>
